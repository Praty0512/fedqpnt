[project]
name = "fedqpnt"
version = "0.1.0"
description = "Federated, quantum-sensor-augmented PNT with continuous attack-adaptive trust fusion"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12", "matplotlib>=3.8", "pandas>=2.0", "torch>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
